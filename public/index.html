<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>be</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--sub:#777;--line:#ddd;--hover:#f0f0f0;--err:#c00;--warn:#fff3c4}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#e4e4e4;--sub:#888;--line:#333;--hover:#262626;--err:#f66;--warn:#4a3d00}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line)}
#cloud.err{color:var(--err);border-color:var(--err)}
#warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--warn)}
#warn[hidden]{display:none}
#warn span{flex:1;min-width:200px}
#name{flex:1;min-width:0;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:none;color:inherit;font:inherit}
#name:hover,#name:focus{border-color:var(--line);outline:none}
#status{color:var(--sub);font-size:12px;white-space:nowrap;padding:0 4px}
#status.err{color:var(--err)}
button{padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:none;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
#t{flex:1;width:100%;padding:12px;border:0;outline:0;resize:none;background:none;color:inherit;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}
body.drag #t{outline:2px dashed var(--sub);outline-offset:-6px}
#recent{inset:auto;top:40px;right:8px;width:min(420px,calc(100vw - 16px));max-height:70vh;overflow:auto;margin:0;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);box-shadow:0 4px 16px #0003}
#recent .row{display:flex;align-items:center;gap:8px;border-radius:4px}
#recent .row:hover{background:var(--hover)}
#recent a{flex:1;min-width:0;padding:6px 8px;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#recent .cur a{font-weight:600}
#recent time{color:var(--sub);font-size:12px;white-space:nowrap}
#recent .row button{border:0;color:var(--sub)}
#recent .empty{padding:8px;color:var(--sub)}
</style>
</head>
<body>
<header>
<input id="name" placeholder="untitled.txt" spellcheck="false" autocomplete="off" aria-label="ファイル名">
<span id="status"></span>
<button id="new" title="新規">New</button>
<button id="dup" title="新しい UUID に内容をコピーする">複製</button>
<button popovertarget="recent" title="最近ひらいたもの">Recent</button>
<button id="dl" title="ダウンロード (Ctrl/⌘+S)">Download</button>
<button id="cloud" title="クラウドに保存">☁</button>
</header>
<div id="warn" hidden>
<span id="warnText"></span>
<button id="usecloud">クラウド版を読みこむ</button>
<button id="overwrite">この内容で上書き</button>
</div>
<textarea id="t" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="本文"></textarea>
<div id="recent" popover></div>
<script>
const DOC = 'be:doc:', IDX = 'be:index'
const CLOUD_MAX = 256 * 1024 // クラウドに保存できる上限(バイト)。サーバー側と合わせる
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/
const $ = id => document.getElementById(id)
const ta = $('t'), nameEl = $('name'), statusEl = $('status'), recentEl = $('recent')
const cloudEl = $('cloud'), warnEl = $('warn')
let id, timer = 0, dirty = false
// クラウド同期の状態。conflict はクラウド側の {version, name, updated}
let syncing = false, cloudErr = '', conflict = null

const loadIndex = () => { try { return JSON.parse(localStorage.getItem(IDX)) || {} } catch { return {} } }
const status = (s, err) => { statusEl.textContent = s; statusEl.className = err ? 'err' : '' }
const setTitle = () => { document.title = nameEl.value || 'untitled.txt' }
// 新規ドキュメントの初期ファイル名。作成日時(ローカル時刻)を入れる
const defaultName = () => {
  const d = new Date(), p = n => String(n).padStart(2, '0')
  return `untitled-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.txt`
}

// 本文とインデックス(Recent用)を書きこむ。失敗(容量超過など)したら false
// インデックスの各項目: n=ファイル名, t=更新時刻, c=最後に同期したクラウド側の version, d=クラウド未保存なら 1
function write(docId, name, text, extra) {
  try {
    localStorage.setItem(DOC + docId, text)
    const idx = loadIndex()
    idx[docId] = { ...idx[docId], n: name, t: Date.now(), d: 1, ...extra }
    localStorage.setItem(IDX, JSON.stringify(idx))
    return true
  } catch (e) {
    status('保存失敗: ' + e.name, true)
    return false
  }
}

function save() {
  clearTimeout(timer); timer = 0
  if (!dirty) return
  // 空のままの新規ドキュメントは Recent に残さない
  if (!ta.value && !nameEl.value && !loadIndex()[id]) { dirty = false; status(''); return }
  if (write(id, nameEl.value, ta.value)) { dirty = false; status('Saved'); renderCloud() }
}

// ---- クラウド保存 (R2) ----

function renderCloud() {
  const m = loadIndex()[id]
  const [icon, tip] =
    conflict ? [' ⚠', 'クラウド側と競合しています'] :
    cloudErr ? [' ⚠', cloudErr] :
    syncing ? [' …', 'クラウドに保存中'] :
    m?.d ? [' ●', 'クラウドに未保存の変更があります(クリックで保存)'] :
    m?.c ? [' ✓', 'クラウドに保存済み'] : ['', 'クラウドに保存']
  cloudEl.textContent = '☁' + icon
  cloudEl.title = tip
  cloudEl.className = conflict || cloudErr ? 'err' : ''
  warnEl.hidden = !conflict
  if (conflict) $('warnText').textContent =
    `クラウド側が別の場所で更新されています(「${conflict.name || 'untitled.txt'}」 ${new Date(conflict.version).toLocaleString()})。保存すると上書きされます。両方残すには「複製」を使ってください。`
}

const patchIndex = (docId, patch) => {
  const idx = loadIndex()
  if (!idx[docId]) return
  Object.assign(idx[docId], patch)
  localStorage.setItem(IDX, JSON.stringify(idx))
}
const SAVE_FAILED = 'クラウドに保存できませんでした(自動で再試行します)'
const RATE_LIMITED = 'クラウドへの保存回数が多すぎます(しばらくして自動で再試行します)'
const TOO_LARGE = '256KB を超えているため、クラウドに保存できません(この PC には保存されています)'
const decodeName = s => { try { return decodeURIComponent(s || '') } catch { return s || '' } }

// ローカルの内容をクラウドに保存する。クラウド側が知らないうちに更新されていたら 409 で警告になる
async function push() {
  save()
  const docId = id, m = loadIndex()[docId]
  if (!m || syncing) return
  const body = localStorage.getItem(DOC + docId) ?? ''
  if (new Blob([body]).size > CLOUD_MAX) { cloudErr = TOO_LARGE; renderCloud(); return }
  syncing = true; renderCloud()
  let err = '', conf = null
  try {
    const r = await fetch('/api/doc/' + docId, {
      method: 'PUT',
      headers: { 'x-base': m.c || 0, 'x-name': encodeURIComponent(m.n), 'x-updated': m.t },
      body,
    })
    const data = await r.json()
    if (r.status === 409) conf = { ...data, name: decodeName(data.name) }
    else if (r.status === 413) err = TOO_LARGE
    else if (r.status === 429) err = RATE_LIMITED
    else if (!r.ok) err = SAVE_FAILED
    // 送信中にさらに編集されていたら、未保存のままにする
    else patchIndex(docId, { c: data.version, d: loadIndex()[docId]?.t === m.t ? 0 : 1 })
  } catch { err = SAVE_FAILED }
  syncing = false
  if (docId === id) { cloudErr = err; conflict = conf }
  renderCloud()
}

// クラウド側の内容を確認し、安全なら取りこむ。ローカルに未保存の変更があれば警告にする
async function pull(force) {
  const docId = id
  try {
    const r = await fetch('/api/doc/' + docId, { cache: 'no-store' })
    if (docId !== id || !r.ok) return
    const text = await r.text()
    if (docId !== id) return
    save()
    const version = Number(r.headers.get('x-version')), name = decodeName(r.headers.get('x-name'))
    const m = loadIndex()[docId]
    if (!force && m?.c === version) return
    if (!force && m?.d) { conflict = { version, name }; return }
    if (!write(docId, name, text, { t: Number(r.headers.get('x-updated')) || Date.now(), c: version, d: 0 })) return
    ta.value = text; nameEl.value = name
    dirty = false; conflict = null; cloudErr = ''
    setTitle(); status('')
  } catch {
    // オフラインなど。ローカルの内容でそのまま編集できる
  } finally {
    if (docId === id) renderCloud()
  }
}

function touch() {
  dirty = true
  status('…')
  clearTimeout(timer)
  timer = setTimeout(save, 300)
}

function open(docId, nav) {
  save()
  id = docId
  if (nav) history[nav + 'State'](null, '', '/' + id)
  ta.value = localStorage.getItem(DOC + id) ?? ''
  nameEl.value = loadIndex()[id]?.n ?? defaultName()
  dirty = false; conflict = null; cloudErr = ''
  setTitle(); status(''); renderCloud()
  ta.setSelectionRange(0, 0); ta.scrollTop = 0; ta.focus()
  pull()
}

function route() {
  const p = location.pathname.slice(1)
  if (UUID.test(p)) open(p); else open(crypto.randomUUID(), 'replace')
}

function download() {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain' }))
  a.download = nameEl.value || 'untitled.txt'
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

function fmtTime(t) {
  const d = new Date(t), now = new Date()
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString()
}

function renderRecent() {
  save()
  const items = Object.entries(loadIndex()).sort((a, b) => b[1].t - a[1].t)
  recentEl.textContent = ''
  if (!items.length) {
    const e = document.createElement('div')
    e.className = 'empty'; e.textContent = 'まだありません'
    recentEl.append(e)
    return
  }
  for (const [docId, m] of items) {
    const row = document.createElement('div'), a = document.createElement('a')
    const time = document.createElement('time'), del = document.createElement('button')
    row.className = 'row' + (docId === id ? ' cur' : '')
    a.href = '/' + docId; a.textContent = m.n || 'untitled.txt'; a.title = docId
    time.textContent = fmtTime(m.t)
    del.textContent = '×'; del.title = '削除'; del.dataset.del = docId
    row.append(a, time, del)
    recentEl.append(row)
  }
}

ta.addEventListener('input', touch)
nameEl.addEventListener('input', () => { setTitle(); touch() })
nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) ta.focus() })
$('new').addEventListener('click', () => open(crypto.randomUUID(), 'push'))
$('dl').addEventListener('click', download)
$('dup').addEventListener('click', () => {
  save()
  const docId = crypto.randomUUID()
  if (write(docId, nameEl.value, ta.value)) open(docId, 'push')
})
cloudEl.addEventListener('click', push)
$('usecloud').addEventListener('click', () => pull(true))
$('overwrite').addEventListener('click', () => {
  // クラウド側の現在の version を基準にして保存しなおす
  patchIndex(id, { c: conflict.version })
  conflict = null
  push()
})
// 変更があれば 10 秒ごとにクラウドへ保存する。競合中は勝手に上書きしない
setInterval(() => { if (!conflict && !syncing && (dirty || loadIndex()[id]?.d)) push() }, 10000)

recentEl.addEventListener('beforetoggle', e => { if (e.newState === 'open') renderRecent() })
recentEl.addEventListener('click', e => {
  const del = e.target.closest('[data-del]'), a = e.target.closest('a')
  if (del) {
    const docId = del.dataset.del, idx = loadIndex()
    if (!confirm(`「${idx[docId]?.n || 'untitled.txt'}」を削除しますか?`)) return
    delete idx[docId]
    localStorage.removeItem(DOC + docId)
    localStorage.setItem(IDX, JSON.stringify(idx))
    if (docId === id) { dirty = false; recentEl.hidePopover(); open(crypto.randomUUID(), 'replace') }
    else renderRecent()
  } else if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault()
    recentEl.hidePopover()
    open(a.pathname.slice(1), 'push')
  }
})

addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); download() }
})
ta.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && !e.isComposing) {
    e.preventDefault()
    document.execCommand('insertText', false, '\t') // undo履歴を保つ
  }
})

// ファイルのドラッグ&ドロップでひらく
const hasFiles = e => e.dataTransfer?.types.includes('Files')
addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); document.body.classList.add('drag') } })
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag') })
addEventListener('drop', async e => {
  if (!hasFiles(e)) return
  e.preventDefault()
  document.body.classList.remove('drag')
  const files = [...e.dataTransfer.files]
  save()
  let first
  for (const f of files) {
    const text = await f.text()
    // いまのドキュメントが空で未保存なら、そこに読みこむ
    const reuse = !first && !ta.value && !loadIndex()[id]
    const docId = reuse ? id : crypto.randomUUID()
    if (!write(docId, f.name, text)) break
    first ??= docId
  }
  if (first) { dirty = false; open(first, first === id ? '' : 'push'); status('Saved') }
})

addEventListener('popstate', route)
addEventListener('pagehide', save)
document.addEventListener('visibilitychange', () => { if (document.hidden) save() })
// 別タブで同じドキュメントが更新されたら追従する
addEventListener('storage', e => {
  if (e.key === DOC + id && !dirty) {
    ta.value = e.newValue ?? ''
    nameEl.value = loadIndex()[id]?.n ?? ''
    setTitle()
  }
})

route()
</script>
</body>
</html>
